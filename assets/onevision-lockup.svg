<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" role="img" aria-label="OneVision Marketing Agency">
  <title>OneVision Marketing Agency lockup</title>
  <g transform="translate(200 40)">
    <g fill="none" stroke="#1F3F68" stroke-width="24" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
      <g id="ov-arrow">
        <path d="M200 8 L200 178"/>
        <path d="M108 40 L200 132 L292 40"/>
